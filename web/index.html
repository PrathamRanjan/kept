<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kept: subscriptions people can change in one step</title>
    <meta name="description" content="Kept lets members of small subscription shops, and their AI assistants, skip, pause, switch or cancel a PayPal subscription in one step, and keeps the ones who'd rather pause." />
    <!--kept:head-->
    <script>try{var t=localStorage.getItem("kept-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/static/a11y.js" defer></script>
    <script src="/static/journey.js" defer></script>
  </body>
</html>
